<!DOCTYPE html>  <!--This document is written in HTML5 Language-->
<html lang="en">
<head>  <!--This is the head section of the HTML document, which contains metadata and links to external resources-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot Web Application</title><!--The name which appears in the browser tab-->
    <link rel="stylesheet" href="styles.css"> <!--This line links the external CSS file to the HTML document-->
</head>
<body> 
    <div class="navbar"> <!--This is a div element with a class attribute set to "container"-->
        <a href="">Home</a>
        <a href="">Toggle</a>
        <a href="">Random User</a>
     </div> <!--This is an empty div element that can be used to group other elements or apply styles--> 
     <div class="card"> <!--This is a div element with a class attribute set to "container"-->
        <img src = "/images/jane.png" alt = "User Image">
        <h3>Jane Doe</h3>
        <p>Software Engineer</p>
     </div>
    <!--This will appear inside the body of the HTML document-->
    <script src="index.js"></script> <!--This line links the external JavaScript file to the HTML document-->
</body><!-- The javascript file will be just above the closing tag of the body tag i.e ending-->
</html>

<!-- Tom cat sees the files in the static folder so we can directly access them without any path -->
<!-- <a> is an anchor tag used to create hyperlinks and which helps in redirecting to another page-->
<!-- In the anchor tag we will include the href attribute to specify the URL of the page to link to-->
