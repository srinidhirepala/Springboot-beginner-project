<!DOCTYPE html>  <!--This document is written in HTML5 Language-->
<html lang="en">
<head>  <!--This is the head section of the HTML document, which contains metadata and links to external resources-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot Web Application</title><!--The name which appears in the browser tab-->
    <link rel="stylesheet" href="styles.css"> <!--This line links the external CSS file to the HTML document-->
</head>
<body> 
    <h1>Hello, Spring Boot!</h1> <!--This will appear inside the body of the HTML document-->
    <h1>Welcome to Spring Boot!</h1>
    <script src="index.js"></script> <!--This line links the external JavaScript file to the HTML document-->
</body><!-- The javascript file will be just above the closing tag of the body tag i.e ending-->
</html>

<!-- Tom cat sees the files in the static folder so we can directly access them without any path -->
